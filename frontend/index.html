 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webdown</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Webdown</h1>
            <p>Write normally → Beautiful Web Pages</p>
            <div class="header-actions">
                <button id="newBtn">New</button>
                <button id="saveBtn">Save</button>
                <button id="downloadBtn" disabled>Export</button>
            </div>
        </header>

        <div class="main">
            <div class="sidebar">
                <div class="projects">
                    <h3>Projects</h3>
                    <div id="projectList">Loading...</div>
                </div>
                <div class="stats">
                    <div>Writing Time: <span id="readTime">0s</span></div>
                    <div>Total Words: <span id="words">0</span></div>
                </div>
            </div>

            <div class="editor-preview">
                <div class="editor">
                    <div class="editor-header">
                        <h3>Draft / Notes</h3>
                        <button id="aiGenerateBtn" class="ai-btn">✨ Beautify Page</button>
                    </div>
                    <textarea id="editor">Write normally here...</textarea>
                </div>
                <div class="preview">
                    <h3>Preview</h3>
                    <div id="preview">Write markdown to see preview...</div>
                    <div id="tableOfContents"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
